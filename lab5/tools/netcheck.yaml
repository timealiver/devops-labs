apiVersion: v1
kind: Pod
metadata:
  name: probe-1
  namespace: shop
  labels:
    app.kubernetes.io/name: probe
    team: shop
spec:
  nodeName: lab-worker
  containers:
    - name: probe
      image: registry.local/netcheck:1.0
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
