apiVersion: v1
kind: Namespace
metadata:
  name: outsider
  labels:
    kubernetes.io/metadata.name: outsider
---
apiVersion: v1
kind: Pod
metadata:
  name: as-api
  namespace: shop
  labels:
    app.kubernetes.io/name: api
    team: shop
    test: "true"
spec:
  containers:
    - name: probe
      image: registry.local/netcheck:1.0
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
