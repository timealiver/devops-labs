apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  labels:
    app.kubernetes.io/name: api
    team: {{ .Values.team }}
spec:
  replicas: {{ .Values.api.replicas }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        team: {{ .Values.team }}
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VERSION
              value: "{{ .Values.api.image.tag }}"
            - name: HEALTH_FAIL
              value: "{{ .Values.api.healthFail }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shop-db-app
                  key: uri
          {{- if .Values.api.preStopSleep }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.api.preStopSleep }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "shop.podSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  labels:
    app.kubernetes.io/name: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.api.nodePort }}
