apiVersion: v1
kind: Pod
metadata:
  name: bad-no-labels
  namespace: default
spec:
  containers:
    - name: app
      image: registry.local/shop-api:1.0
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
