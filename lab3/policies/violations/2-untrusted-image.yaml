apiVersion: v1
kind: Pod
metadata:
  name: bad-untrusted-image
  namespace: default
  labels:
    app.kubernetes.io/name: bad
    team: shop
spec:
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
