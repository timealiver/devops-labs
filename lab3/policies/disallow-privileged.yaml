apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/title: No privileged containers
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
              - kube-system
              - kube-public
              - kube-node-lease
              - kyverno
              - cnpg-system
              - monitoring
              - local-path-storage
      validate:
        message: "Привилегированные контейнеры запрещены."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"

