api:
  replicas: 3
  image:
    repository: registry.local/shop-api
    tag: "1.0"
  healthFail: "false"
  nodePort: 30080
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 64Mi}
worker:
  replicas: 2
  image:
    repository: registry.local/shop-worker
    tag: "1.0"
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 64Mi}
postgres:
  instances: 1
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
team: shop
monitoring:
  enabled: true
  interval: 10s
