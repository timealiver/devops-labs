apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-worker
  labels:
    app.kubernetes.io/name: worker
    team: {{ .Values.team }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        team: {{ .Values.team }}
    spec:
      containers:
        - name: worker
          image: {{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shop-db-app
                  key: uri
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "shop.podSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-worker
  labels:
    app.kubernetes.io/name: worker
spec:
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: http
      port: 8080
      targetPort: http
