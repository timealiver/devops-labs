name: lab1

services:
  api:
    image: api:slim
    container_name: lab1-api
    restart: unless-stopped
    cgroup_parent: lab1
    mem_limit: 100m
    memswap_limit: 100m
    cpus: 0.5
    pids_limit: 50
    ports:
      - "8083:8080"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lab1-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=2s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8084:8080"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: lab1-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lab1-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lab1.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
