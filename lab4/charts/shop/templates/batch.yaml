apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-batch
  labels:
    app.kubernetes.io/name: batch
    team: {{ .Values.team }}
spec:
  replicas: {{ .Values.batch.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: batch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch
        team: {{ .Values.team }}
    spec:
      priorityClassName: {{ .Values.priority.batch.name }}
      containers:
        - name: batch
          image: {{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: BATCH_MEM_MB
              value: "{{ .Values.batch.memMb }}"
            - name: BATCH_CPU
              value: "{{ .Values.batch.cpu }}"
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
          {{- include "shop.podSecurity" . | nindent 10 }}
